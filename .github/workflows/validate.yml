name: Validate mappings
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mappings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate_mappings.py
      - run: python tools/format_mappings.py
      - run: python tools/run_example.py
      - run: python -m unittest discover -s tests
      - name: Check generated views
        run: |
          python tools/generate_trees.py
          git diff --exit-code -- docs/ archetypes/
